name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest==7.4.3  # Version the suite was verified with locally.
      # Tests use fake native clients and a temporary IHAV_HOME; they make no network or provider calls.
      - name: Offline test suite
        run: python -B -m pytest -q -ra tests
      - name: Build and verify the installable package
        run: |
          python -B scripts/build_package.py --output "$RUNNER_TEMP/ihav-agent-room.zip"
          python -B bin/ihav-agent-room --json verify-package "$RUNNER_TEMP/ihav-agent-room.zip"
